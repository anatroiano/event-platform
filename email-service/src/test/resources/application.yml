spring:
  config:
    import: ""

  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: false
    clean-disabled: true
    validate-migration-naming: true

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

app:
  mail:
    from: test@example.com