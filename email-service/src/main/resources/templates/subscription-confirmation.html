<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscrição confirmada</title>
</head>

<body style="margin: 0; padding: 0; background-color: #f4f6f8; font-family: Arial, Helvetica, sans-serif; color: #1f2937;">
<table width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color: #f4f6f8; padding: 40px 16px;">
    <tr>
        <td align="center">

            <table width="100%" cellpadding="0" cellspacing="0" border="0"
                   style="max-width: 560px; background-color: #ffffff; border-radius: 12px; overflow: hidden;">

                <tr>
                    <td style="padding: 32px 40px; background-color: #111827; text-align: center;">
                        <h1 style="margin: 0; color: #ffffff; font-size: 24px; font-weight: 700;">
                            Inscrição confirmada!
                        </h1>
                    </td>
                </tr>

                <tr>
                    <td style="padding: 40px;">

                        <p style="margin: 0 0 20px; font-size: 16px; line-height: 1.6;">
                            Sua inscrição foi realizada com sucesso!
                        </p>

                        <p style="margin: 0 0 24px; font-size: 16px; line-height: 1.6;">
                            Você está inscrito(a) no evento:
                        </p>

                        <div style="margin-bottom: 32px; padding: 20px; background-color: #f3f4f6; border-radius: 8px; text-align: center;">
                            <strong th:text="${eventTitle}"
                                    style="font-size: 20px; color: #111827;">
                                Evento
                            </strong>
                        </div>

                        <p style="margin: 0 0 28px; font-size: 15px; line-height: 1.6; color: #6b7280;">
                            Para confirmar sua presença, clique no botão abaixo:
                        </p>

                        <table width="100%" cellpadding="0" cellspacing="0" border="0">
                            <tr>
                                <td align="center">
                                    <a th:href="${checkinUrl}"
                                       style="display: inline-block; padding: 14px 28px; background-color: #2563eb; color: #ffffff; text-decoration: none; font-size: 16px; font-weight: 700; border-radius: 8px;">
                                        Confirmar minha presença
                                    </a>
                                </td>
                            </tr>
                        </table>

                        <p style="margin: 32px 0 0; font-size: 13px; line-height: 1.5; color: #9ca3af; text-align: center;">
                            Se você não realizou esta inscrição, ignore este e-mail.
                        </p>

                    </td>
                </tr>

                <tr>
                    <td style="padding: 20px 40px; background-color: #f9fafb; text-align: center;">
                        <p style="margin: 0; font-size: 12px; color: #9ca3af;">
                            Este é um e-mail automático. Por favor, não responda.
                        </p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
