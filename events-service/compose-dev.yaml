services:
  db:
    image: postgres:18.0
    env_file:
      - .env
    volumes:
      - db-volume-dev:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    image: events-service-dev
    container_name: events-service-dev
    build:
      context: .
      dockerfile: Dockerfile-dev
    ports:
      - "8081:8081"
      - "5005:5005"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./src:/app/src
      - maven-repository:/root/.m2

volumes:
  db-volume-dev:
  maven-repository: